[package]
name = "ebook2m4b"
version = "0.2.3"
edition = "2024"
license = "GPL-3.0-only"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
html-escape = "0.3.0"
misaki-rs = { git = "https://github.com/elana-voss/misaki-rs", rev = "9fd64c7563e5548ef00885ac5b78f3ae7b984baf" }
ort = { version = "=2.0.0-rc.13", features = ["cuda", "directml", "load-dynamic"] }
percent-encoding = "2"
regex = "1"
roxmltree = "0.20"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = { version = "0.4", default-features = false }

# whisper.cpp built in: on Windows for another card (Vulkan)
[target.'cfg(windows)'.dependencies]
whisper-rs = { version = "0.16", features = ["vulkan", "raw-api"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "0.8"

# espeak-rs-sys fixed for MSVC, carried in our misaki-rs fork
[patch.crates-io]
espeak-rs-sys = { git = "https://github.com/elana-voss/misaki-rs", rev = "9fd64c7563e5548ef00885ac5b78f3ae7b984baf" }

[profile.release]
debug = "line-tables-only"
